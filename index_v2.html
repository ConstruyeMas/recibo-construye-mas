<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo Construye Más V2</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  overflow:hidden;
}

/* PANTALLAS */
.screen{
  position:fixed;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  padding:30px;
  background-size:cover;
  background-position:center;
}

/* Pantalla activa */
.active{
  display:flex;
}

/* Overlay oscuro elegante */
.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  top:0;
  left:0;
}

/* Contenido encima del overlay */
.content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:400px;
}

/* Input premium */
.input-premium{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  color:white;
  font-size:18px;
  margin-top:20px;
  outline:none;
}

/* Slider inferior */
.slider-container{
  position:fixed;
  bottom:40px;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  z-index:3;
}

.slider-btn{
  padding:18px 40px;
  border-radius:40px;
  border:1px solid rgba(255,255,255,0.4);
  background:rgba(0,0,0,0.6);
  color:white;
  font-size:16px;
  letter-spacing:1px;
}

</style>
</head>

<body>

<!-- SPLASH -->
<div class="screen active" id="splash" style="background-image:url('fondo1.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h1>CONSTRUYE MÁS</h1>
    <p>Sistema Interno</p>
  </div>
</div>

<!-- PANTALLA NOMBRE -->
<div class="screen" id="screen-nombre" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Nombre del cliente</h2>
    <input type="text" class="input-premium" id="nombreInput" placeholder="Nombre completo">
  </div>
</div>
<!-- PANTALLA CONCEPTO -->
<div class="screen" id="screen-concepto" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Concepto / Obra</h2>
    <input type="text" class="input-premium" id="conceptoInput" placeholder="Nombre de la obra">
  </div>
</div>

<!-- PANTALLA MONTO -->
<div class="screen" id="screen-monto" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Monto recibido</h2>
    <input type="number" class="input-premium" id="montoInput" placeholder="$ 0.00">
  </div>
</div>

<!-- PANTALLA LOADING -->
<div class="screen" id="screen-loading" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Procesando recibo...</h2>
  </div>
</div>

<!-- PANTALLA RECIBO -->
<div class="screen" id="screen-recibo" style="background:#f2f2f2; color:black;">
  <div class="content">
    <h2>Aquí va el recibo V1</h2>
  </div>
</div>

<script>

/* Splash automático 2 segundos */
setTimeout(()=>{
  goTo("screen-nombre");
},2000);
function goTo(nextScreen){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(nextScreen).classList.add("active");
}
document.getElementById("nombreInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-concepto");
  }
});

document.getElementById("conceptoInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-monto");
  }
});

document.getElementById("montoInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-loading");

    setTimeout(()=>{
      goTo("screen-recibo");
    },1200);
  }
});
</script>

</body>
</html>
