<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo Construye Más V2</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  overflow:hidden;
}

/* ===== SPLASH CINEMÁTICO ===== */
#splashScreen{
  position:fixed;
  inset:0;
  background:url('assets/img/splash.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:bgCinematic 3.5s ease forwards;
}

.logoSplash{
  opacity:0;
  transform:translateY(25px);
  animation:logoReveal 1s ease forwards;
  animation-delay:2.5s;
}

.logoSplash img{
  width:220px;
}

@keyframes bgCinematic{
  0%{
    transform:scale(1.1);
    filter:blur(10px) brightness(0.6);
  }
  100%{
    transform:scale(1);
    filter:blur(0px) brightness(1);
  }
}

@keyframes logoReveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ===== PANTALLAS ===== */
.screen{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  background-size:cover;
  background-position:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.45s ease;
}

.screen.active{
  opacity:1;
  pointer-events:auto;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  top:0;
  left:0;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:400px;
  padding:20px;
}

.input-premium{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  color:white;
  font-size:18px;
  margin-top:20px;
  outline:none;
}

/* ===== SLIDER V2 ===== */
.slider-container{
  margin-top:40px;
  width:100%;
}

.slider-track{
  width:100%;
  height:60px;
  background:rgba(255,255,255,0.15);
  border-radius:50px;
  position:relative;
  overflow:hidden;
}

.slider-thumb{
  width:60px;
  height:60px;
  background:white;
  border-radius:50%;
  position:absolute;
  left:0;
  top:0;
  cursor:pointer;
  transition:left 0.1s ease;
}

.slider-text{
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:15px;
  letter-spacing:1px;
}

</style>
</head>
<body>

<!-- SPLASH -->
<div id="splashScreen">
  <div class="logoSplash">
    <img src="assets/img/logo.png" alt="Construye Más">
  </div>
</div>

<!-- NOMBRE -->
<div class="screen" id="screen-nombre" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Nombre del cliente</h2>
    <input type="text" class="input-premium" id="nombreInput" placeholder="Nombre completo">

    <div class="slider-container">
      <div class="slider-track">
        <div class="slider-text">Deslizar para continuar</div>
        <div class="slider-thumb"></div>
      </div>
    </div>
  </div>
</div>

<!-- CONCEPTO -->
<div class="screen" id="screen-concepto" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Concepto / Obra</h2>
    <input type="text" class="input-premium" id="conceptoInput" placeholder="Nombre de la obra">

    <div class="slider-container">
      <div class="slider-track">
        <div class="slider-text">Deslizar para continuar</div>
        <div class="slider-thumb"></div>
      </div>
    </div>
  </div>
</div>

<!-- MONTO -->
<div class="screen" id="screen-monto" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Monto recibido</h2>
    <input type="number" class="input-premium" id="montoInput" placeholder="$ 0.00">

    <div class="slider-container">
      <div class="slider-track">
        <div class="slider-text">Deslizar para continuar</div>
        <div class="slider-thumb"></div>
      </div>
    </div>
  </div>
</div>

<!-- EMITIR -->
<div class="screen" id="screen-emitir" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Emitir comprobante</h2>

    <div class="slider-container">
      <div class="slider-track">
        <div class="slider-text">Deslizar para emitir</div>
        <div class="slider-thumb"></div>
      </div>
    </div>
  </div>
</div>

<!-- CONFIRMACION -->
<div class="screen" id="screen-confirmacion" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Comprobante emitido correctamente</h2>

    <div class="slider-container">
      <div class="slider-track">
        <div class="slider-text">Deslizar para salir</div>
        <div class="slider-thumb"></div>
      </div>
    </div>
  </div>
</div>

<script>

function goTo(nextScreen){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(nextScreen).classList.add("active");
}

let currentIndex = 0;

const screens = [
  "screen-nombre",
  "screen-concepto",
  "screen-monto",
  "screen-emitir",
  "screen-confirmacion"
];

function nextScreen(){
  if(currentIndex < screens.length - 1){
    currentIndex++;
    goTo(screens[currentIndex]);
  }
}

window.addEventListener("load", function(){

  document.getElementById("screen-nombre").classList.add("active");

  setTimeout(()=>{
      const splash = document.getElementById("splashScreen");
      splash.style.transition = "opacity 0.6s ease";
      splash.style.opacity = "0";

      setTimeout(()=>{
          splash.remove();
      },600);

  },3500);

});

/* ===== SLIDER LOGICA ===== */
document.querySelectorAll(".slider-thumb").forEach(thumb => {

  let isDown = false;
  let startX = 0;

  thumb.addEventListener("mousedown", e=>{
    isDown = true;
    startX = e.clientX;
  });

  document.addEventListener("mouseup", ()=>{
    if(isDown){
      if(parseInt(thumb.style.left) > 200){
        nextScreen();
      }
      thumb.style.left = "0px";
      isDown = false;
    }
  });

  document.addEventListener("mousemove", e=>{
    if(!isDown) return;

    let move = e.clientX - startX;
    if(move < 0) move = 0;
    if(move > 250) move = 250;

    thumb.style.left = move + "px";
  });

});

</script>

</body>
</html>
