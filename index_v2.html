<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recibo Construye Más V2</title>

<style>

/* RESET */
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, sans-serif;
}

body{
  overflow:hidden;
}

/* ===== SPLASH CINEMÁTICO ===== */
#splashScreen{
  position:fixed;
  inset:0;
  background:url('assets/img/splash.jpg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:9999;
  animation:bgCinematic 3.5s ease forwards;
}

.logoSplash{
  opacity:0;
  transform:translateY(25px);
  animation:logoReveal 1s ease forwards;
  animation-delay:2.5s;
}

.logoSplash img{
  width:220px;
}

@keyframes bgCinematic{
  0%{
    transform:scale(1.1);
    filter:blur(10px) brightness(0.6);
  }
  100%{
    transform:scale(1);
    filter:blur(0px) brightness(1);
  }
}

@keyframes logoReveal{
  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ===== PANTALLAS ===== */
.screen{
  position:fixed;
  width:100vw;
  height:100vh;
  top:0;
  left:0;
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  padding:30px;
  background-size:cover;
  background-position:center;
}

.active{
  display:flex;
}

.overlay{
  position:absolute;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.45);
  top:0;
  left:0;
}

.content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:400px;
}

.input-premium{
  width:100%;
  padding:16px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.1);
  backdrop-filter:blur(10px);
  color:white;
  font-size:18px;
  margin-top:20px;
  outline:none;
}

</style>
</head>
<body>

<!-- SPLASH -->
<div id="splashScreen">
  <div class="logoSplash">
    <img src="assets/img/logo.png" alt="Construye Más">
  </div>
</div>

<!-- PANTALLA NOMBRE -->
<div class="screen" id="screen-nombre" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Nombre del cliente</h2>
    <input type="text" class="input-premium" id="nombreInput" placeholder="Nombre completo">
  </div>
</div>

<!-- PANTALLA CONCEPTO -->
<div class="screen" id="screen-concepto" style="background-image:url('fondo2.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Concepto / Obra</h2>
    <input type="text" class="input-premium" id="conceptoInput" placeholder="Nombre de la obra">
  </div>
</div>

<!-- PANTALLA MONTO -->
<div class="screen" id="screen-monto" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Monto recibido</h2>
    <input type="number" class="input-premium" id="montoInput" placeholder="$ 0.00">
  </div>
</div>

<!-- PANTALLA LOADING -->
<div class="screen" id="screen-loading" style="background-image:url('fondo3.jpg');">
  <div class="overlay"></div>
  <div class="content">
    <h2>Procesando recibo...</h2>
  </div>
</div>

<!-- PANTALLA RECIBO -->
<div class="screen" id="screen-recibo" style="background:#f2f2f2; color:black;">
  <div class="content">
    <h2>Aquí va el recibo V1</h2>
  </div>
</div>

<script>

function goTo(nextScreen){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(nextScreen).classList.add("active");
}

window.addEventListener("load", function(){

  // Activamos pantalla nombre detrás del splash
  document.getElementById("screen-nombre").classList.add("active");

  // Después de animación splash
  setTimeout(()=>{
      const splash = document.getElementById("splashScreen");

      splash.style.transition = "opacity 0.6s ease";
      splash.style.opacity = "0";

      setTimeout(()=>{
          splash.remove();
      },600);

  },3500);

});

document.getElementById("nombreInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-concepto");
  }
});

document.getElementById("conceptoInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-monto");
  }
});

document.getElementById("montoInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    goTo("screen-loading");

    setTimeout(()=>{
      goTo("screen-recibo");
    },1200);
  }
});

</script>

</body>
</html>
